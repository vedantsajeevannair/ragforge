services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      - ragforge-data:/data
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ragforge-data:
